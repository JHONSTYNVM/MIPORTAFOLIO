<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Portafolio Académico</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: min(480px, 100%);
            padding: 42px;
            border: 1px solid rgba(0,229,255,.25);
            border-radius: 28px;
            background: linear-gradient(
                145deg,
                rgba(5,37,84,.92),
                rgba(8,25,65,.82)
            );
            box-shadow: 0 30px 90px rgba(0,0,0,.35);
            backdrop-filter: blur(16px);
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
        }

        .login-brand img {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        .login-brand strong {
            display: block;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .login-brand span {
            display: block;
            color: #62eaff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.8px;
        }

        .login-card h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .login-card > p {
            color: #bcd0ea;
            margin-bottom: 28px;
        }

        .login-field {
            margin-bottom: 16px;
        }

        .login-field label {
            display: block;
            color: #dceaff;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .login-field input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border-radius: 13px;
            border: 1px solid rgba(0,229,255,.2);
            outline: 0;
            background: rgba(1,14,38,.65);
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-field input:focus {
            border-color: #49eaff;
            box-shadow: 0 0 0 3px rgba(0,229,255,.07);
        }

        .login-submit {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 14px;
            color: #fff;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(100deg,#6947ff,#00cfff);
            box-shadow: 0 12px 30px rgba(0,160,255,.2);
            margin-top: 8px;
        }

        .login-submit:disabled {
            opacity: .6;
            cursor: wait;
        }

        .login-message {
            min-height: 24px;
            margin-top: 14px;
            font-size: 12px;
            color: #8fa9ca;
        }

        .login-back {
            display: inline-block;
            margin-top: 20px;
            color: #62eaff;
            text-decoration: none;
            font-weight: 800;
            font-size: 12px;
        }

        .login-admin-note {
            margin-top: 22px;
            padding: 13px 14px;
            border-radius: 13px;
            border: 1px solid rgba(0,229,255,.12);
            background: rgba(0,120,200,.06);
            color: #91a9c8;
            font-size: 11px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="fondo-tecnologico" aria-hidden="true">

    <img
        class="decor-planeta"
        src="img/fondo/planeta-tecnologico.png"
        alt=""
    >

    <img
        class="decor-ondas"
        src="img/fondo/ondas-tecnologicas.png"
        alt=""
    >

    <img
        class="decor-red"
        src="img/fondo/red-tecnologica.png"
        alt=""
    >

    <img
        class="decor-codigo"
        src="img/fondo/codigo.png"
        alt=""
    >

    <img
        class="decor-circuitos"
        src="img/fondo/circuitos.png"
        alt=""
    >

</div>


<main class="login-page">

    <section class="login-card">

        <div class="login-brand">

            <img
                src="img/logo-upla.png"
                alt="UPLA"
            >

            <div>
                <strong>PORTAFOLIO</strong>
                <span>ACADÉMICO UNIVERSITARIO</span>
            </div>

        </div>


        <h1>Acceso administrador</h1>

        <p>
            Ingresa para gestionar tus materiales desde
            <strong>Mis Cursos</strong>.
        </p>


        <form id="login-form">

            <div class="login-field">

                <label for="email">
                    Correo
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="login-field">

                <label for="password">
                    Contraseña
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="login-submit"
                id="login-submit"
                type="submit"
            >
                🔐 Iniciar sesión
            </button>


            <div
                class="login-message"
                id="login-message"
                aria-live="polite"
            ></div>

        </form>


        <div class="login-admin-note">

            Este acceso es únicamente para el administrador
            del portafolio. No se habilita registro público.

        </div>


        <a
            class="login-back"
            href="cursos.html"
        >
            ← Volver a Mis Cursos
        </a>

    </section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>


<script>

(function () {

    const form = document.getElementById('login-form');

    const button = document.getElementById('login-submit');

    const message = document.getElementById('login-message');

    const emailInput = document.getElementById('email');

    const passwordInput = document.getElementById('password');


    /* ================================
       COMPROBAR CONFIGURACIÓN
       ================================ */

    const cfg = window.PORTAFOLIO_SUPABASE || {};


    if (!cfg.url || !cfg.anonKey) {

        message.textContent =
            'Falta configurar Supabase en js/supabase-config.js.';

        return;

    }


    /* ================================
       CREAR CLIENTE SUPABASE
       ================================ */

    const client = window.supabase.createClient(
        cfg.url,
        cfg.anonKey
    );


    /* ================================
       INICIAR SESIÓN
       ================================ */

    form.addEventListener('submit', async function (e) {

        e.preventDefault();


        button.disabled = true;

        message.textContent = 'Verificando acceso...';


        const email = emailInput.value.trim();

        const password = passwordInput.value;


        /* ================================
           LOGIN CON SUPABASE AUTH
           ================================ */

        const {
            data: loginData,
            error: loginError
        } = await client.auth.signInWithPassword({

            email: email,

            password: password

        });


        /* ================================
           ERROR DE LOGIN
           ================================ */

        if (loginError) {

            console.error(
                'Error de inicio de sesión:',
                loginError
            );

            message.textContent =
                'No se pudo iniciar sesión. Verifica tu correo y contraseña.';

            button.disabled = false;

            return;

        }


        /* ================================
           OBTENER USUARIO ACTUAL
           ================================ */

        const {
            data: sessionData,
            error: sessionError
        } = await client.auth.getSession();


        if (sessionError) {

            console.error(
                'Error obteniendo sesión:',
                sessionError
            );

            message.textContent =
                'No se pudo obtener la sesión.';

            button.disabled = false;

            return;

        }


        const currentUser =
            sessionData?.session?.user;


        if (!currentUser) {

            message.textContent =
                'No se encontró el usuario autenticado.';

            button.disabled = false;

            return;

        }


        console.log(
            'Usuario autenticado:',
            currentUser.id
        );


        /* ================================
           COMPROBAR ADMINISTRADOR
           ================================ */

        const {
            data: isAdmin,
            error: adminError
        } = await client.rpc(
            'is_portfolio_admin'
        );


        /* ================================
           ERROR DE PERMISOS
           ================================ */

        if (adminError) {

            console.error(
                'Error verificando administrador:',
                adminError
            );

            message.textContent =
                'Error al verificar permisos: ' +
                adminError.message;

            button.disabled = false;

            return;

        }


        console.log(
            '¿Es administrador?:',
            isAdmin
        );


        /* ================================
           NO ES ADMINISTRADOR
           ================================ */

        if (!isAdmin) {

            await client.auth.signOut();

            message.textContent =
                'La cuenta no tiene permisos de administrador.';

            button.disabled = false;

            return;

        }


        /* ================================
           ACCESO CORRECTO
           ================================ */

        message.textContent =
            'Acceso correcto. Entrando...';


        window.location.href =
            'cursos.html';

    });

})();

</script>

</body>
</html>
